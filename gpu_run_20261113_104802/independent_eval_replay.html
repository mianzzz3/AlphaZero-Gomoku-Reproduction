<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlphaZero 五子棋复测棋谱</title>
<style>
:root { color-scheme: light; --paper:#f8f6ee; --ink:#1b2d27; --muted:#526660; --green:#245f4f; --rule:#cbd4cc; }
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.55 system-ui,sans-serif; }
main { max-width:1050px; margin:0 auto; padding: clamp(20px,4vw,48px); }
h1 { margin:0 0 4px; font-size:clamp(27px,5vw,42px); letter-spacing:-.025em; }
p { margin:0; }
.subtitle, .legend, .game-meta { color:var(--muted); }
select, button { font:inherit; border:1px solid var(--rule); border-radius:6px; padding:8px 12px; background:#fff; color:var(--ink); }
button { min-height:43px; }
button:disabled { opacity:.42; }
button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--green); outline-offset:2px; }
.layout { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(250px,.75fr); gap:clamp(20px,5vw,46px); align-items:start; margin-top:24px; }
.board { background:#e5cb9b; border:1px solid #d2b488; border-radius:12px; width:100%; height:auto; display:block; }
.controls { margin-top:12px; display:grid; gap:14px; }
.game-picker { display:grid; gap:5px; }
.game-picker label { font-weight:620; }
.game-meta { border-block:1px solid var(--rule); padding:14px 0; }
.step { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
.step output { font-variant-numeric:tabular-nums; }
input[type=range] { width:100%; margin:4px 0 0; accent-color:var(--green); }
.buttons { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; }
.legend { margin-top:5px; }
.stone { display:inline-block; vertical-align:middle; width:13px; height:13px; border-radius:50%; margin-right:6px; border:1px solid #575042; }
.black { background:#202925; }
.white { background:#fffcf1; }
@media (max-width:660px) {
  .layout { grid-template-columns:1fr; gap:10px; }
  .controls { margin-top:0; }
}
</style>
</head>
<body>
<main>
  <h1>AlphaZero 五子棋复测棋谱</h1>
  <p class="subtitle" id="summary"></p>
  <div class="layout">
    <svg id="board" class="board" viewBox="0 0 500 500" role="img" aria-label="10×10 棋盘">
      <g id="grid" aria-hidden="true"></g>
      <g id="stones" aria-hidden="true"></g>
    </svg>
    <section aria-label="棋谱回放" class="controls">
      <div class="game-picker">
        <label for="game">选择对局</label>
        <select id="game"></select>
      </div>
      <p class="game-meta" id="game-meta"></p>
      <div>
        <div class="step"><label for="step">落子进度</label><output id="progress" for="step"></output></div>
        <input type="range" min="0" value="0" id="step">
      </div>
      <div class="buttons">
        <button type="button" id="undo">上一手</button>
        <button type="button" id="next">下一手</button>
        <button type="button" id="end">看终局</button>
      </div>
      <div class="legend">
        <p><span class="stone black"></span>黑棋先手　<span class="stone white"></span>白棋后手</p>
        <p>圆点标记最新落子。终局绿色线标记连五。</p>
      </div>
    </section>
  </div>
</main>

<script>
"use strict";
const data = JSON.parse(document.getElementById("data").textContent);
const gameSelect = document.getElementById("game");
const progressSlider = document.getElementById("step");
const board = document.getElementById("board");
const grid = document.getElementById("grid");
const stones = document.getElementById("stones");
const undo = document.getElementById("undo");
const next = document.getElementById("next");
const end = document.getElementById("end");
const letters = "ABCDEFGHIJ";
const boardSize = 10;
const interval = 46;
const margin = 43;
const svgNamespace = "http://www.w3.org/2000/svg";
const point = (column, row) => [margin + column * interval, margin + (boardSize - 1 - row) * interval];
const resultText = {win:"模型胜", draw:"和棋", loss:"纯 MCTS 胜"};
const buildSvg = (type, attributes, label = "") => {
  const node = document.createElementNS(svgNamespace, type);
  for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, value);
  if (label) node.textContent = label;
  return node;
};
const line = (a, b, stroke, width) =>
  buildSvg("line", {x1:a[0], y1:a[1], x2:b[0], y2:b[1], stroke, "stroke-width":width, "stroke-linecap":"round"});

for (let i = 0; i < boardSize; i++) {
  const [x, y] = point(i, i);
  grid.append(line([x, margin], [x, 500 - margin], "#846948", 1.4));
  grid.append(line([margin, y], [500 - margin, y], "#846948", 1.4));
  grid.append(buildSvg("text", {x, y:482, "text-anchor":"middle", fill:"#5c482d", "font-size":14}, letters[i]));
  grid.append(buildSvg("text", {x:20, y:y+5, "text-anchor":"middle", fill:"#5c482d", "font-size":14}, String(i+1)));
}

function winningRun(moves) {
  const last = moves.at(-1);
  const sameSide = new Set(moves.filter((_, i) => i % 2 === (moves.length - 1) % 2));
  const col = last % boardSize;
  const row = Math.floor(last / boardSize);
  const inRun = (x, y) => x>=0 && x<boardSize && y>=0 && y<boardSize && sameSide.has(y*boardSize+x);
  for (const [dx, dy] of [[1,0],[0,1],[1,1],[1,-1]]) {
    let begin = 0, finish = 0;
    while (inRun(col+(begin-1)*dx,row+(begin-1)*dy)) begin--;
    while (inRun(col+(finish+1)*dx,row+(finish+1)*dy)) finish++;
    if (finish-begin+1 >= 5) {
      return [point(col+begin*dx,row+begin*dy), point(col+finish*dx,row+finish*dy)];
    }
  }
  return null;
}

function render() {
  const g = data.games[Number(gameSelect.value) - 1];
  const ply = Number(progressSlider.value);
  const finished = ply === g.moves.length;
  stones.replaceChildren();
  for (const [i, move] of g.moves.slice(0, ply).entries()) {
    const [cx, cy] = point(move % boardSize, Math.floor(move / boardSize));
    const black = i % 2 === 0;
    stones.append(buildSvg("circle", {cx,cy,r:17,fill:black?"#202925":"#fffcf1",stroke:black?"#15201a":"#9c8a68","stroke-width":1.5}));
  }
  if (finished && g.outcome !== "draw") {
    const run = winningRun(g.moves);
    if (run) stones.append(line(run[0],run[1],"#318369",4));
  }
  if (ply > 0) {
    const last = g.moves[ply-1];
    const [cx, cy] = point(last % boardSize, Math.floor(last / boardSize));
    stones.append(buildSvg("circle", {cx,cy,r:4.5,fill:"#db6f38"}));
  }
  undo.disabled = ply === 0;
  next.disabled = finished;
  end.disabled = finished;
  document.getElementById("game-meta").textContent =
    (g.model_first ? "模型执黑先手" : "模型执白后手") + " · " + resultText[g.outcome] + " · " + g.moves.length + " 手";
  document.getElementById("progress").textContent = ply + " / " + g.moves.length;
  board.setAttribute("aria-label","第 " + g.game + " 局，" + (finished ? "终局" : "第 " + ply + " 手") + "，" + (g.model_first ? "模型执黑" : "模型执白"));
}

function openGame() {
  const g = data.games[Number(gameSelect.value) - 1];
  progressSlider.max = String(g.moves.length);
  progressSlider.value = progressSlider.max;
  render();
}
function moveStep(change) {
  progressSlider.value = String(Math.min(Number(progressSlider.max), Math.max(0, Number(progressSlider.value) + change)));
  render();
}
for (const g of data.games) {
  const opt = document.createElement("option");
  opt.value = g.game;
  opt.textContent = "第 " + String(g.game).padStart(2, "0") + " 局 · " + (g.model_first ? "模型先手" : "模型后手") + " · " + resultText[g.outcome];
  gameSelect.append(opt);
}
const summary = data.summary.overall;
document.getElementById("summary").textContent =
  "10×10 连五 · 模型 400 次 / 纯 MCTS 5000 次 · " +
  summary.games + " 局，模型 " + summary.wins + " 胜 " + summary.draws + " 和 " + summary.losses + " 负";
gameSelect.addEventListener("change", openGame);
progressSlider.addEventListener("input", render);
undo.addEventListener("click", () => moveStep(-1));
next.addEventListener("click", () => moveStep(1));
end.addEventListener("click", () => { progressSlider.value = progressSlider.max; render(); });
document.addEventListener("keydown", e => {
  if (["INPUT","SELECT"].includes(e.target.tagName)) return;
  if (e.key==="ArrowLeft") moveStep(-1);
  if (e.key==="ArrowRight") moveStep(1);
});
openGame();
</script>
</body>
</html>
